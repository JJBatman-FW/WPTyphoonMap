<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颱風生成與 ENSO 關係地圖 (連動年份路徑查詢)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #111;
            color: #fff;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(30, 30, 30, 0.85);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            width: 260px;
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            color: #ddd;
        }

        .btn {
            background-color: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 2px;
            margin-bottom: 5px;
            width: 48%;
        }

        .btn:hover {
            background-color: #666;
        }

        .custom-cross {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tooltip-custom {
            font-family: sans-serif;
            text-align: center;
        }

        .track-tooltip {
            font-family: sans-serif;
            text-align: left;
            line-height: 1.4;
        }

        .track-tooltip b {
            color: #2c5282;
            font-size: 14px;
        }

        .level-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .track-select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="controls">
        <h3>颱風生成分析 (1990-2020)</h3>
        <p id="yearDisplay" style="font-size: 14px; color:#aaa;">目前顯示：載入中...</p>
        <div style="display: flex; justify-content: space-between;">
            <button class="btn" onclick="prevYear()">上一年代</button>
            <button class="btn" onclick="nextYear()">下一年代</button>
        </div>
        <hr style="border-color: #555; margin: 10px 0;">
        <button class="btn" onclick="showAllYears30()"
            style="background-color: #2c5282; width: 100%;">切換：30年十字總覽</button>

        <hr style="border-color: #555; margin: 15px 0;">
        <label for="typhoonSelect" style="font-size: 14px; color: #ddd;">🔍 聚焦當年颱風路徑：</label>
        <select id="typhoonSelect" class="track-select" onchange="switchTrack()">
            <option value="none">--- 載入中 ---</option>
        </select>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([15.0, 135.0], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 10
        }).addTo(map);

        const pointsLayerGroup = L.layerGroup().addTo(map);
        const ellipseLayerGroup = L.layerGroup().addTo(map);
        const summaryLayerGroup = L.layerGroup();
        const trackLayerGroup = L.layerGroup().addTo(map);

        const overlays = {
            "颱風生成點位 (依風速)": pointsLayerGroup,
            "68% 生成熱區 (橢圓)": ellipseLayerGroup,
            "動態路徑追蹤": trackLayerGroup
        };
        L.control.layers(null, overlays, { collapsed: false }).addTo(map);

        // ==========================================
        // 1. 預存的各年颱風路徑資料庫與全域狀態
        // ==========================================

        let allTyphoonTracks = {};
        let yearlyData = [];
        let currentIndex = 0;
        let isSummaryMode = false;
        let currentDisplayedYear = null;
        
        // ✨ 新增：記憶「是否正在顯示全部路徑」的狀態變數
        let isShowingAllTracks = false; 

        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQDl63WMfspNESxWKp9MqPBwnhOq5m_JWChuAFf1OefJkVUh7vp3ojFeS5k3bYVulu0a-nB6Ag_DCv7/pub?gid=0&single=true&output=csv";

        function getEnsoColor(ensoState) {
            if (ensoState === 'ElNino') return '#FF4444';
            if (ensoState === 'LaNina') return '#4488FF';
            return '#AAAAAA';
        }
        function getColorByLevel(level) {
            if (level.includes('強烈')) return '#FF4444';
            if (level.includes('中度')) return '#FFAA00';
            if (level.includes('輕度')) return '#4488FF';
            if (level.includes('熱帶性低氣壓')) return '#AAAAAA';
            return '#00FF88';
        }

        function processGoogleSheetsData(rawData) {
            const groupedData = {};
            allTyphoonTracks = {}; // 確保每次讀取時先清空

            rawData.forEach(row => {
                if (!row['編號'] || !row['生成緯度（N）'] || !row['生成經度（E）']) return;

                const idString = String(row['編號']);
                const year = parseInt(idString.substring(0, 4));

                // 處理 ENSO 狀態
                let rawEnso = row['聖嬰/反聖嬰'];
                let ensoState = 'Neutral';
                if (rawEnso) {
                    const ensoStr = String(rawEnso);
                    if (ensoStr.includes('反') || ensoStr.toLowerCase().includes('la')) ensoState = 'LaNina';
                    else if (ensoStr.includes('聖') || ensoStr.toLowerCase().includes('el')) ensoState = 'ElNino';
                }

                // 處理生成點基礎資料
                let maxWind = parseFloat(row['颱風生命期間中心最大風速(m/s)']);
                if (isNaN(maxWind)) maxWind = 15;
                let typhoonName = row['颱風名稱'] || row['名稱'] || row['中文譯名'] || row['Name'] || '未知名稱';

                if (!groupedData[year]) groupedData[year] = { year: year, enso: ensoState, points: [] };

                groupedData[year].points.push({
                    name: typhoonName,
                    lat: parseFloat(row['生成緯度（N）']),
                    lon: parseFloat(row['生成經度（E）']),
                    wind: maxWind
                });

                // 動態解析儲存格內的 JSON 路徑資料
                let trackJsonString = row['路徑'];

                if (trackJsonString && trackJsonString.trim().startsWith('[')) {
                    try {
                        let trackNodes = JSON.parse(trackJsonString);

                        if (trackNodes.length > 0) {
                            let tName = trackNodes[0].name;
                            let tSeason = trackNodes[0].season;
                            let trackKey = `${tName}_${tSeason}`;

                            allTyphoonTracks[trackKey] = trackNodes;
                        }
                    } catch (e) {
                        console.error(`解析颱風 ${typhoonName} 的路徑資料失敗:`, e);
                    }
                }
            });

            return Object.values(groupedData).sort((a, b) => a.year - b.year);
        }

        // ==========================================
        // 2. 動態更新下拉選單
        // ==========================================
        function updateTrackDropdown(year) {
            const select = document.getElementById('typhoonSelect');
            select.innerHTML = ''; // 清空選單

            // 找出屬於這一年的所有颱風路徑 Key
            const availableTracks = Object.keys(allTyphoonTracks).filter(key => {
                return allTyphoonTracks[key][0].season === year;
            });

            // 預設選項
            let optNone = document.createElement('option');
            optNone.value = 'none';
            optNone.text = '--- 隱藏 / 不顯示路徑 ---';
            select.appendChild(optNone);

            if (availableTracks.length > 0) {
                // 如果該年有超過1筆以上的路徑，新增「顯示全部」選項
                if (availableTracks.length >= 1) {
                    let optAll = document.createElement('option');
                    optAll.value = 'all';
                    optAll.text = `▶ 顯示 ${year} 年全部路徑`;
                    optAll.style.fontWeight = 'bold';
                    optAll.style.color = '#4488FF';
                    select.appendChild(optAll);
                }

                // 逐一新增該年各個颱風的選項
                availableTracks.forEach(trackKey => {
                    let opt = document.createElement('option');
                    opt.value = trackKey;
                    let tName = allTyphoonTracks[trackKey][0].name;
                    opt.text = `${tName} (${year})`;
                    select.appendChild(opt);
                });
            } else {
                // 若該年無資料，顯示提醒並停用選單
                let optEmpty = document.createElement('option');
                optEmpty.value = 'none';
                optEmpty.text = `(目前資料庫無 ${year} 年路徑)`;
                optEmpty.disabled = true;
                select.appendChild(optEmpty);
            }
        }

        function loadYear(index) {
            if (yearlyData.length === 0) return;

            if (isSummaryMode) {
                map.removeLayer(summaryLayerGroup);
                map.addLayer(pointsLayerGroup);
                map.addLayer(ellipseLayerGroup);
                isSummaryMode = false;
            }

            pointsLayerGroup.clearLayers();
            ellipseLayerGroup.clearLayers();
            trackLayerGroup.clearLayers(); // 切換年份時，自動清空畫布上的路徑

            const data = yearlyData[index];
            currentDisplayedYear = data.year; 

            let ensoText = data.enso === 'ElNino' ? ' (聖嬰年)' : data.enso === 'LaNina' ? ' (反聖嬰年)' : ' (正常年)';
            document.getElementById('yearDisplay').innerText = `目前顯示：${data.year} ${ensoText}`;

            // 更新下拉式選單內容
            const trackSelect = document.getElementById('typhoonSelect');
            trackSelect.disabled = false;
            updateTrackDropdown(data.year);

            // ✨ 新增邏輯：檢查並繼承「顯示全部路徑」的狀態
            if (isShowingAllTracks) {
                let hasAllOption = Array.from(trackSelect.options).some(opt => opt.value === 'all');

                if (hasAllOption) {
                    trackSelect.value = 'all';
                    // 手動觸發 change 事件，繪製新年度的全部路徑
                    trackSelect.dispatchEvent(new Event('change')); 
                } else {
                    isShowingAllTracks = false; // 該年無資料，重置狀態
                }
            }

            let latSum = 0, lonSum = 0;
            data.points.forEach(p => {
                let radiusSize = p.wind * 0.4;
                let tooltipContent = `<div class="tooltip-custom"><b>${p.name}</b><br>風速: ${p.wind} m/s</div>`;

                L.circleMarker([p.lat, p.lon], {
                    radius: radiusSize, color: getEnsoColor(data.enso), fillColor: getEnsoColor(data.enso),
                    fillOpacity: 0.5, weight: 1
                }).bindTooltip(tooltipContent).addTo(pointsLayerGroup);

                latSum += p.lat; lonSum += p.lon;
            });

            if (data.points.length > 1) {
                let centerLat = latSum / data.points.length;
                let centerLon = lonSum / data.points.length;
                let varLat = 0, varLon = 0;
                data.points.forEach(p => {
                    varLat += Math.pow(p.lat - centerLat, 2); varLon += Math.pow(p.lon - centerLon, 2);
                });
                let stdDevLat = Math.sqrt(varLat / data.points.length);
                let stdDevLon = Math.sqrt(varLon / data.points.length);

                let ellipsePoints = [];
                for (let i = 0; i <= 360; i += 5) {
                    let rad = i * Math.PI / 180;
                    ellipsePoints.push([centerLat + stdDevLat * Math.sin(rad), centerLon + stdDevLon * Math.cos(rad)]);
                }

                L.polygon(ellipsePoints, {
                    color: getEnsoColor(data.enso), fillColor: getEnsoColor(data.enso),
                    fillOpacity: 0.1, weight: 2, dashArray: '5, 5', interactive: false
                }).addTo(ellipseLayerGroup);
            }
        }

        // 獨立繪製單一颱風路徑的函式
        function drawSingleTrack(targetData, allLatLngsCollector) {
            const trackLatLngs = targetData.map(point => {
                allLatLngsCollector.push([point.lat, point.lon]); 
                return [point.lat, point.lon];
            });

            L.polyline(trackLatLngs, { color: '#FFFFFF', weight: 2, dashArray: '4, 6', opacity: 0.6 }).addTo(trackLayerGroup);

            targetData.forEach(point => {
                let radiusSize = point.tokyo_wind * 0.4;
                let pointColor = getColorByLevel(point.level);
                let tooltipContent = `
                    <div class="track-tooltip">
                        <b>${point.name} (${point.season})</b><br>
                        <span class="level-badge" style="background-color: ${pointColor};">${point.level}</span><br>
                        時間：${point.iso_time}<br>
                        風速：${point.tokyo_wind} m/s<br>
                        氣壓：${point.tokyo_pres} hPa
                    </div>
                `;
                L.circleMarker([point.lat, point.lon], {
                    radius: radiusSize, color: pointColor, fillColor: pointColor, fillOpacity: 0.8, weight: 1.5
                }).bindTooltip(tooltipContent).addTo(trackLayerGroup);
            });
        }

        function switchTrack() {
            trackLayerGroup.clearLayers();
            const selectedValue = document.getElementById('typhoonSelect').value;
            
            // ✨ 新增邏輯：更新全域變數記憶狀態
            if (selectedValue === 'all') {
                isShowingAllTracks = true;
            } else {
                isShowingAllTracks = false; 
            }

            if (selectedValue === 'none') return;

            let allLatLngsToFit = [];

            if (selectedValue === 'all') {
                // 找出當年所有的路徑並全部畫出
                const availableTracks = Object.keys(allTyphoonTracks).filter(key => allTyphoonTracks[key][0].season === currentDisplayedYear);
                availableTracks.forEach(trackKey => {
                    drawSingleTrack(allTyphoonTracks[trackKey], allLatLngsToFit);
                });
            } else {
                // 畫出單一指定的颱風
                const targetData = allTyphoonTracks[selectedValue];
                if (targetData) drawSingleTrack(targetData, allLatLngsToFit);
            }

            // 對焦至(所有)軌跡
            if (allLatLngsToFit.length > 0) {
                map.fitBounds(L.polyline(allLatLngsToFit).getBounds(), { padding: [50, 50], maxZoom: 7 });
            }
        }

        function showAllYears30() {
            if (yearlyData.length === 0) return;
            isSummaryMode = true;

            map.removeLayer(pointsLayerGroup);
            map.removeLayer(ellipseLayerGroup);
            trackLayerGroup.clearLayers(); // 隱藏路徑
            map.addLayer(summaryLayerGroup);
            summaryLayerGroup.clearLayers();

            document.getElementById('yearDisplay').innerText = '目前顯示：30年中心點總覽';

            // 30年模式停用選單
            const select = document.getElementById('typhoonSelect');
            select.innerHTML = '<option value="none">三十年總覽模式不顯示路徑</option>';
            select.disabled = true;

            yearlyData.forEach(data => {
                if (data.points.length === 0) return;
                let latSum = 0, lonSum = 0;
                data.points.forEach(p => { latSum += p.lat; lonSum += p.lon; });
                let centerLat = latSum / data.points.length;
                let centerLon = lonSum / data.points.length;
                let crossColor = getEnsoColor(data.enso);

                let crossIcon = L.divIcon({
                    className: 'custom-cross',
                    html: `<div style="color: ${crossColor}; font-size: 24px; font-weight: bold; line-height: 1; text-align: center; text-shadow: 1px 1px 2px #000;">+</div>`,
                    iconSize: [24, 24], iconAnchor: [12, 12]
                });

                L.marker([centerLat, centerLon], { icon: crossIcon }).bindTooltip(`${data.year} 中心點`).addTo(summaryLayerGroup);
            });
        }

        function nextYear() {
            if (yearlyData.length === 0) return;
            currentIndex = (currentIndex + 1) % yearlyData.length;
            loadYear(currentIndex);
        }

        function prevYear() {
            if (yearlyData.length === 0) return;
            currentIndex = (currentIndex - 1 + yearlyData.length) % yearlyData.length;
            loadYear(currentIndex);
        }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function (results) {
                console.log("資料下載完成！");
                yearlyData = processGoogleSheetsData(results.data);
                if (yearlyData.length > 0) loadYear(0);
                else document.getElementById('yearDisplay').innerText = '資料載入失敗或無有效資料。';
            }
        });
    </script>
</body>

</html>
